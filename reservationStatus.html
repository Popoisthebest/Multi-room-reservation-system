<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예약 현황 - DAESHILL</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/reservation.css" />
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">DAESHILL</a>
        </div>
        <nav class="main-nav">
          <a href="index.html">홈</a>
          <a href="reservation.html">예약하기</a>
          <a href="reservationStatus.html" class="active">예약 현황</a>
          <a href="mypage.html">마이페이지</a>
        </nav>
        <div class="auth-buttons">
          <button id="loginButton" class="auth-button">로그인</button>
          <button id="signupButton" class="auth-button">회원가입</button>
          <button id="logoutButton" class="auth-button" style="display: none">
            로그아웃
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="reservation-container">
        <div class="reservation-header">
          <h2 class="reservation-title">예약 현황</h2>
          <button id="refreshButton" class="refresh-button">
            <span class="refresh-icon">↻</span> 새로고침
          </button>
        </div>

        <div class="reservation-status">
          <table class="status-table" id="statusTable">
            <thead>
              <tr>
                <th>호실</th>
                <th>날짜</th>
                <th>시간</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <!-- 예약 목록이 여기에 동적으로 추가됩니다 -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <div class="footer-section">
          <h3>DAESHILL</h3>
          <p>동아리 활동을 위한 공간 예약 서비스</p>
        </div>
        <div class="footer-section">
          <h3>제작자</h3>
          <p><a href="https://github.com/Popoisthebest">#Popoisthebest</a></p>
          <p><a href="https://github.com/CloudR1ng">#CloudR1ng</a></p>
          <p><a href="https://github.com/UntameDuck">#UntameDuck</a></p>
        </div>
        <div class="footer-section">
          <h3>예약 시간</h3>
          <p>예약 간격은 한 주 단위이며,</p>
          <p>취소는 당일 오전 8시까지 가능합니다.</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2025 A.C.T.(KE) All rights reserved.</p>
      </div>
    </footer>

    <!-- JavaScript 파일 로드 -->
    <script src="js/common.js"></script>
    <script type="module" src="js/reservationStatus.js"></script>
  </body>
</html>
