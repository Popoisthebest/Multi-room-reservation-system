<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 - 멀티룸 예약 시스템</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">멀티룸 예약 시스템</a>
        </div>
        <nav class="main-nav">
          <a href="index.html">홈</a>
          <a href="calendar.html">예약하기</a>
          <a href="reservationStatus.html">예약 현황</a>
          <a href="mypage.html">마이페이지</a>
        </nav>
        <div class="auth-buttons">
          <button id="loginButton" class="auth-button">로그인</button>
          <button id="signupButton" class="auth-button">회원가입</button>
          <button id="logoutButton" class="auth-button" style="display: none">
            로그아웃
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="auth-container">
        <div class="auth-card">
          <h2>회원가입</h2>
          <form id="signupForm" class="auth-form">
            <div class="form-group">
              <label for="email">이메일</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="password">비밀번호</label>
              <input type="password" id="password" name="password" required />
            </div>
            <div class="form-group">
              <label for="confirmPassword">비밀번호 확인</label>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                required
              />
            </div>
            <div class="form-group">
              <label for="studentId">학번 (5자리)</label>
              <input
                type="text"
                id="studentId"
                name="studentId"
                maxlength="5"
                pattern="[0-9]{5}"
                title="5자리 숫자를 입력해주세요"
                required
                oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 5)"
              />
            </div>
            <div class="form-group">
              <label for="name">이름</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="club">동아리</label>
              <input type="text" id="club" name="club" required />
            </div>
            <div class="form-group">
              <label for="contact">연락처</label>
              <input type="tel" id="contact" name="contact" required />
            </div>
            <div class="form-actions">
              <button type="submit" class="button button-primary">
                회원가입
              </button>
              <a href="login.html" class="button button-secondary">로그인</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <div class="footer-section">
          <h3>멀티룸 예약 시스템</h3>
          <p>동아리 활동을 위한 공간 예약 서비스</p>
        </div>
        <div class="footer-section">
          <h3>연락처</h3>
          <p>이메일: support@multiroom.com</p>
          <p>전화: 02-1234-5678</p>
        </div>
        <div class="footer-section">
          <h3>운영 시간</h3>
          <p>평일: 09:00 - 18:00</p>
          <p>주말: 10:00 - 17:00</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2024 멀티룸 예약 시스템. All rights reserved.</p>
      </div>
    </footer>

    <script>
      // Firebase 설정
      const firebaseConfig = {
        apiKey: "AIzaSyAen8SrBB-4446BNQP6onn4Xv__aLQDVVU",
        authDomain: "multi-room-reservation-system.firebaseapp.com",
        projectId: "multi-room-reservation-system",
        storageBucket: "multi-room-reservation-system.appspot.com",
        messagingSenderId: "498301757165",
        appId: "1:498301757165:web:56230ab27bceee46a1cee4",
      };

      // Firebase 초기화
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      // 로그인 상태 확인
      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          window.location.href = "index.html";
        }
      });

      // 회원가입 폼 제출 처리
      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const studentId = document.getElementById("studentId").value;
          const name = document.getElementById("name").value;
          const club = document.getElementById("club").value;
          const contact = document.getElementById("contact").value;

          // 비밀번호 확인
          if (password !== confirmPassword) {
            alert("비밀번호가 일치하지 않습니다.");
            return;
          }

          try {
            // Firebase Auth로 계정 생성
            const userCredential = await firebase
              .auth()
              .createUserWithEmailAndPassword(email, password);

            // Firestore에 사용자 정보 저장
            await firebase
              .firestore()
              .collection("users")
              .doc(userCredential.user.uid)
              .set({
                email,
                studentId,
                name,
                club,
                contact,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              });

            alert("회원가입이 완료되었습니다.");
            window.location.href = "index.html";
          } catch (error) {
            let errorMessage = "회원가입 중 오류가 발생했습니다.";

            switch (error.code) {
              case "auth/email-already-in-use":
                errorMessage = "이미 사용 중인 이메일입니다.";
                break;
              case "auth/invalid-email":
                errorMessage = "유효하지 않은 이메일 형식입니다.";
                break;
              case "auth/weak-password":
                errorMessage = "비밀번호가 너무 약합니다.";
                break;
            }

            alert(errorMessage);
          }
        });

      // 버튼 이벤트 리스너
      document.getElementById("loginButton").addEventListener("click", () => {
        window.location.href = "login.html";
      });

      document.getElementById("signupButton").addEventListener("click", () => {
        window.location.href = "signup.html";
      });

      document
        .getElementById("logoutButton")
        .addEventListener("click", async () => {
          try {
            await firebase.auth().signOut();
            window.location.href = "index.html";
          } catch (error) {
            console.error("로그아웃 중 오류:", error);
          }
        });
    </script>
  </body>
</html>
