<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAESHILL</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">DAESHILL</a>
        </div>
        <nav class="main-nav">
          <a href="index.html">홈</a>
          <a href="reservationForm.html">예약하기</a>
          <a href="reservationStatus.html">예약 현황</a>
          <a href="mypage.html">마이페이지</a>
        </nav>
        <div class="auth-buttons">
          <button id="loginButton" class="auth-button">로그인</button>
          <button id="signupButton" class="auth-button">회원가입</button>
          <button id="logoutButton" class="auth-button" style="display: none">
            로그아웃
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- 여기에 각 페이지의 컨텐츠가 들어갑니다 -->
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <div class="footer-section">
          <h3>DAESHILL</h3>
          <p>동아리 활동을 위한 공간 예약 서비스</p>
        </div>
        <div class="footer-section">
          <h3>제작자</h3>
          <p><a href="https://github.com/Popoisthebest">#Popoisthebest</a></p>
          <p><a href="https://github.com/CloudR1ng">#CloudR1ng</a></p>
          <p><a href="https://github.com/UntameDuck">#UntameDuck</a></p>
        </div>
        <div class="footer-section">
          <h3>예약 시간</h3>
          <p>예약 간격은 한 주 단위이며,</p>
          <p>취소는 당일 오전 8시까지 가능합니다.</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2025 A.C.T.(KE) All rights reserved.</p>
      </div>
    </footer>

    <script>
      // Firebase 설정
      const firebaseConfig = {
        apiKey: "AIzaSyAen8SrBB-4446BNQP6onn4Xv__aLQDVVU",
        authDomain: "multi-room-reservation-system.firebaseapp.com",
        projectId: "multi-room-reservation-system",
        storageBucket: "multi-room-reservation-system.appspot.com",
        messagingSenderId: "498301757165",
        appId: "1:498301757165:web:56230ab27bceee46a1cee4",
      };

      // Firebase 초기화
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      // 로그인 상태 확인
      firebase.auth().onAuthStateChanged((user) => {
        const loginButton = document.getElementById("loginButton");
        const signupButton = document.getElementById("signupButton");
        const logoutButton = document.getElementById("logoutButton");

        if (user) {
          loginButton.style.display = "none";
          signupButton.style.display = "none";
          logoutButton.style.display = "block";
        } else {
          loginButton.style.display = "block";
          signupButton.style.display = "block";
          logoutButton.style.display = "none";
        }
      });

      // 버튼 이벤트 리스너
      document.getElementById("loginButton").addEventListener("click", () => {
        window.location.href = "login.html";
      });

      document.getElementById("signupButton").addEventListener("click", () => {
        window.location.href = "signup.html";
      });

      document
        .getElementById("logoutButton")
        .addEventListener("click", async () => {
          try {
            await firebase.auth().signOut();
            window.location.href = "index.html";
          } catch (error) {
            console.error("로그아웃 중 오류:", error);
          }
        });
    </script>
  </body>
</html>
