<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - 멀티룸 예약 시스템</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">멀티룸 예약 시스템</a>
        </div>
        <nav class="main-nav">
          <a href="index.html">홈</a>
          <a href="calendar.html">예약하기</a>
          <a href="reservationStatus.html">예약 현황</a>
          <a href="mypage.html">마이페이지</a>
        </nav>
        <div class="auth-buttons">
          <button id="loginButton" class="auth-button">로그인</button>
          <button id="signupButton" class="auth-button">회원가입</button>
          <button id="logoutButton" class="auth-button" style="display: none">
            로그아웃
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="auth-container">
        <div class="auth-card">
          <h2>로그인</h2>
          <form id="loginForm" class="auth-form">
            <div class="form-group">
              <label for="email">이메일</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="password">비밀번호</label>
              <input type="password" id="password" name="password" required />
            </div>
            <div class="form-actions">
              <button type="submit" class="button button-primary">
                로그인
              </button>
              <a href="signup.html" class="button button-secondary">회원가입</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <div class="footer-section">
          <h3>멀티룸 예약 시스템</h3>
          <p>동아리 활동을 위한 공간 예약 서비스</p>
        </div>
        <div class="footer-section">
          <h3>연락처</h3>
          <p>이메일: support@multiroom.com</p>
          <p>전화: 02-1234-5678</p>
        </div>
        <div class="footer-section">
          <h3>운영 시간</h3>
          <p>평일: 09:00 - 18:00</p>
          <p>주말: 10:00 - 17:00</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2024 멀티룸 예약 시스템. All rights reserved.</p>
      </div>
    </footer>

    <script>
      // Firebase 설정
      const firebaseConfig = {
        apiKey: "AIzaSyAen8SrBB-4446BNQP6onn4Xv__aLQDVVU",
        authDomain: "multi-room-reservation-system.firebaseapp.com",
        projectId: "multi-room-reservation-system",
        storageBucket: "multi-room-reservation-system.appspot.com",
        messagingSenderId: "498301757165",
        appId: "1:498301757165:web:56230ab27bceee46a1cee4",
      };

      // Firebase 초기화
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      // 로그인 상태 확인
      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          window.location.href = "index.html";
        }
      });

      // 로그인 폼 제출 처리
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            await firebase.auth().signInWithEmailAndPassword(email, password);
            window.location.href = "index.html";
          } catch (error) {
            let errorMessage = "로그인 중 오류가 발생했습니다.";

            switch (error.code) {
              case "auth/user-not-found":
                errorMessage = "등록되지 않은 이메일입니다.";
                break;
              case "auth/wrong-password":
                errorMessage = "잘못된 비밀번호입니다.";
                break;
              case "auth/invalid-email":
                errorMessage = "유효하지 않은 이메일 형식입니다.";
                break;
            }

            alert(errorMessage);
          }
        });

      // 버튼 이벤트 리스너
      document.getElementById("loginButton").addEventListener("click", () => {
        window.location.href = "login.html";
      });

      document.getElementById("signupButton").addEventListener("click", () => {
        window.location.href = "signup.html";
      });

      document
        .getElementById("logoutButton")
        .addEventListener("click", async () => {
          try {
            await firebase.auth().signOut();
            window.location.href = "index.html";
          } catch (error) {
            console.error("로그아웃 중 오류:", error);
          }
        });
    </script>
  </body>
</html>
