<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - DAESHILL</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">DAESHILL</a>
        </div>
        <nav class="main-nav">
          <a href="index.html">홈</a>
          <a href="calendar.html">예약하기</a>
          <a href="reservationStatus.html">예약 현황</a>
          <a href="mypage.html">마이페이지</a>
        </nav>
        <div class="auth-buttons">
          <button id="loginButton" class="auth-button">로그인</button>
          <button id="logoutButton" class="auth-button" style="display: none">
            로그아웃
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="auth-container">
        <div class="auth-card">
          <h2>로그인</h2>
          <form id="loginForm" class="auth-form">
            <div class="form-group">
              <label for="userId">아이디</label>
              <input type="text" id="userId" name="userId" required />
            </div>
            <div class="form-group">
              <label for="password">비밀번호</label>
              <input type="password" id="password" name="password" required />
            </div>
            <div class="form-actions">
              <button type="submit" class="button button-primary">
                로그인
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <div class="footer-section">
          <h3>DAESHILL</h3>
          <p>동아리 활동을 위한 공간 예약 서비스</p>
        </div>
        <div class="footer-section">
          <h3>연락처</h3>
          <p>이메일: support@multiroom.com</p>
          <p>전화: 02-1234-5678</p>
        </div>
        <div class="footer-section">
          <h3>운영 시간</h3>
          <p>평일: 09:00 - 18:00</p>
          <p>주말: 10:00 - 17:00</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2024 DAESHILL. All rights reserved.</p>
      </div>
    </footer>

    <script>
      // 하드코딩된 사용자 정보
      const users = {
        admin: {
          password: "523523",
          isAdmin: true,
          name: "관리자",
        },
      };

      // 페이지 이동 함수
      const redirectBasedOnUserRole = (userData) => {
        if (userData.isAdmin) {
          window.location.href = "admin.html";
        } else {
          window.location.href = "index.html";
        }
      };

      // 로그인 상태 확인
      const checkLoginStatus = () => {
        const currentUser = localStorage.getItem("currentUser");
        if (currentUser) {
          const userData = JSON.parse(currentUser);
          console.log("현재 로그인 상태:", userData);
          console.log("로그인된 사용자:", userData.name);
          console.log(
            "관리자 여부:",
            userData.isAdmin ? "관리자" : "일반 사용자"
          );
          redirectBasedOnUserRole(userData);
        } else {
          console.log("현재 로그인 상태: 로그아웃");
        }
      };

      // 초기 로그인 상태 확인
      checkLoginStatus();

      // 로그인 폼 제출 처리
      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const userId = document.getElementById("userId").value;
        const password = document.getElementById("password").value;

        // 사용자 확인
        if (users[userId] && users[userId].password === password) {
          // 로그인 성공
          const userData = {
            userId: userId,
            isAdmin: users[userId].isAdmin,
            name: users[userId].name,
          };

          // 로그인 상태 저장
          localStorage.setItem("currentUser", JSON.stringify(userData));

          // 사용자 권한에 따라 페이지 이동
          redirectBasedOnUserRole(userData);
        } else {
          // 로그인 실패 시 구체적인 에러 메시지
          if (!users[userId]) {
            alert("존재하지 않는 아이디입니다.");
          } else {
            alert("비밀번호가 올바르지 않습니다.");
          }
        }
      });

      // 버튼 이벤트 리스너
      document.getElementById("loginButton").addEventListener("click", () => {
        // 이미 로그인 페이지에 있는 경우 아무 동작도 하지 않음
        if (window.location.pathname.includes("login.html")) {
          return;
        }
        window.location.href = "login.html";
      });

      document.getElementById("logoutButton").addEventListener("click", () => {
        localStorage.removeItem("currentUser");
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
